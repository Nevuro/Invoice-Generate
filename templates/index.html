<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Backy - Responsive Dark Mode Invoice Engine</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Custom Confirmation Modal -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="modalTitle">Confirm Action</h3>
      <p id="modalMessage">Are you sure you want to proceed?</p>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn btn-secondary">Cancel</button>
        <button id="modalConfirmBtn" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Tab Navigation -->
    <div class="tab-navigation">
      <button id="tabFormBtn" class="tab-btn active" onclick="switchTab('form')">📄 Invoice Editor</button>
      <button id="tabListBtn" class="tab-btn" onclick="switchTab('list')">📋 All Invoices (<span id="invoiceCount">0</span>)</button>
    </div>

    <!-- Tab 1: Invoice Form View -->
    <div id="invoiceFormView" class="tab-content active-content">
      <div class="header-row">
        <div class="company-title">INVOICE</div>
        <div>
          <div class="field-group">
            <label for="invoiceNumber">Invoice Number</label>
            <input type="text" id="invoiceNumber" placeholder="INV-1001" />
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <div class="field-group">
            <label for="billedFrom">Billed From</label>
            <textarea id="billedFrom" rows="3"></textarea>
          </div>
        </div>
        <div>
          <div class="field-group">
            <label for="billedTo">Billed To</label>
            <textarea id="billedTo" rows="3" placeholder="Client Name & Address"></textarea>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label for="date">Invoice Date</label>
          <input type="date" id="date" />
        </div>
        <div class="field-group">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" />
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th class="col-qty">Qty</th>
              <th class="col-price">Price (<span class="currency-symbol">$</span>)</th>
              <th class="col-total">Total (<span class="currency-symbol">$</span>)</th>
              <th class="col-action"></th>
            </tr>
          </thead>
          <!-- Event delegation target -->
          <tbody id="itemsTableBody">
            <!-- Dynamic line items populated via JS -->
          </tbody>
        </table>
      </div>

      <button class="btn btn-add-row" onclick="addRow()">+ Add Item</button>

      <div class="summary-section">
        <div>
          <div class="grid-2">
            <div class="field-group">
              <label for="paymentTerms">Payment Terms</label>
              <input type="text" id="paymentTerms" />
            </div>
            <div class="field-group">
              <label for="paymentMethods">Payment Methods</label>
              <input type="text" id="paymentMethods" />
            </div>
          </div>
          <div class="field-group">
            <label for="bankDetails">Bank Details</label>
            <textarea id="bankDetails" rows="2"></textarea>
          </div>
          <div class="field-group">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="2"></textarea>
          </div>
        </div>

        <div class="summary-box">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotalDisplay">$0.00</span>
          </div>
          <div class="field-group">
            <label for="taxRate">Tax Rate (%)</label>
            <input type="number" id="taxRate" value="0" min="0" step="0.01" />
          </div>
          <div class="field-group print-hide-empty" id="taxReasonGroup">
            <label for="taxReason">Tax Reason</label>
            <input type="text" id="taxReason" />
          </div>
          <div class="field-group">
            <label for="discountRate">Discount Rate (%)</label>
            <input type="number" id="discountRate" value="0" min="0" max="100" step="0.01" />
          </div>
          <div class="field-group print-hide-empty" id="discountReasonGroup">
            <label for="discountReason">Discount Reason</label>
            <input type="text" id="discountReason" />
          </div>
          <div class="summary-row grand-total">
            <span>Grand Total:</span>
            <span id="grandTotalDisplay">$0.00</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-warning" onclick="clearFormPrompt()">Clear Form</button>
        <button class="btn btn-secondary" onclick="printAndSaveInvoice()">Print / Save PDF</button>
        <button class="btn btn-primary" onclick="saveInvoice()">Save Invoice</button>
      </div>
    </div>

    <!-- Tab 2: Saved Invoices List -->
    <div id="invoiceListView" class="tab-content" style="display: none;">
      <div class="list-header">
        <h2 style="font-size: 1.25rem; font-weight: 700;">Saved Invoices</h2>
        <div class="filter-group">
          <input type="date" id="filterStartDate" onchange="loadHistory()" />
          <input type="date" id="filterEndDate" onchange="loadHistory()" />
          <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="clearFilters()">Reset Filters</button>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Invoice #</th>
              <th>Date</th>
              <th>Billed To</th>
              <th style="text-align: right;">Amount (<span class="currency-symbol">$</span>)</th>
              <th class="col-action" style="text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #94a3b8; padding: 16px;">Loading saved invoices...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
