<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Backy - Responsive Dark Mode Invoice Engine</title>
  <style>
    /* Global Reset & Dark Theme Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a; /* Slate 900 */
      color: #f8fafc; /* Slate 50 */
      padding: 16px 8px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #1e293b; /* Slate 800 */
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    @media (min-width: 640px) {
      body { padding: 30px 15px; }
      .container { padding: 36px; }
    }

    /* Header & Branding */
    .header-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
    }

    @media (min-width: 640px) {
      .header-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 0;
        margin-bottom: 24px;
      }
    }

    .company-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #38bdf8; /* Cyan 400 Accent */
    }

    @media (min-width: 640px) {
      .company-title { font-size: 2rem; }
    }

    /* Form Fields & Responsive Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (min-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 16px;
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8; /* Slate 400 */
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, textarea, select {
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 15px;
      color: #f8fafc;
      width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* Dynamic Mobile Table Styling */
    .table-responsive {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 10px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    table {
      width: 100%;
      min-width: 550px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      background: #0f172a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    .col-qty { width: 80px; }
    .col-price { width: 120px; }
    .col-total { width: 110px; font-weight: 600; color: #38bdf8; text-align: right; }
    .col-action { width: 44px; text-align: center; }

    /* Responsive Summary Section */
    .summary-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (min-width: 768px) {
      .summary-section {
        grid-template-columns: 1fr 300px;
        gap: 24px;
      }
    }

    .summary-box {
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .grand-total {
      font-weight: 800;
      font-size: 1.25rem;
      border-top: 1px solid #334155;
      padding-top: 12px;
      margin-top: 12px;
      color: #38bdf8;
    }

    /* Mobile First Action Controls */
    .actions {
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
      margin-top: 24px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }

    @media (min-width: 640px) {
      .actions {
        flex-direction: row;
        justify-content: flex-end;
      }
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      text-align: center;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%;
    }

    @media (min-width: 640px) {
      .btn {
        width: auto;
        padding: 10px 20px;
        font-size: 14px;
      }
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #0284c7; color: #ffffff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-warning { background: #d97706; color: #ffffff; }
    .btn-warning:hover { background: #b45309; }
    .btn-danger { background: #ef4444; color: #fff; padding: 10px; font-size: 14px; border-radius: 4px; min-width: 40px; min-height: 40px; }
    .btn-danger:hover { background: #dc2626; }
    .btn-add-row { background: #10b981; color: #ffffff; margin-bottom: 20px; }
    .btn-add-row:hover { background: #059669; }

    /* History Section Styling */
    .history-section {
      margin-top: 40px;
      border-top: 1px solid #334155;
      padding-top: 24px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
    }

    /* Print & PDF Engine */
    @page { size: A4 portrait; margin: 0; }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm;
        background: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
      }

      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="date"]::-webkit-inner-spin-button,
      input[type="date"]::-webkit-clear-button {
        display: none !important;
        -webkit-appearance: none !important;
      }

      input[type="date"] {
        -moz-appearance: textfield !important;
        appearance: none !important;
      }

      .container {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        padding: 12mm 15mm !important;
        box-shadow: none !important;
        border: none !important;
        background: white !important;
        transform: scale(0.92);
        transform-origin: top center;
      }

      .actions, .btn-danger, .btn-add-row, .col-action, .history-section {
        display: none !important;
      }

      input, textarea, select {
        border: none !important;
        padding: 0 !important;
        background: transparent !important;
        color: black !important;
        font-size: 11px !important;
        height: auto !important;
        box-shadow: none !important;
      }

      .header-row {
        flex-direction: row !important;
        justify-content: space-between !important;
        margin-bottom: 0.8rem !important;
      }

      .company-title {
        color: black !important;
        font-size: 1.6rem !important;
      }

      .grid-2 {
        grid-template-columns: 1fr 1fr !important;
        margin-bottom: 0.8rem !important;
        gap: 1rem !important;
      }

      .field-group {
        margin-bottom: 0.2rem !important;
        gap: 0.1rem !important;
      }

      label {
        font-size: 8.5px !important;
        color: #444 !important;
      }

      .table-responsive {
        overflow: visible !important;
        margin-bottom: 0.5rem !important;
        border: none !important;
      }

      table {
        width: 100% !important;
        min-width: 100% !important;
      }

      th, td {
        padding: 0.3rem 0.2rem !important;
        border-bottom: 1px solid #ddd !important;
        color: black !important;
        font-size: 10px !important;
      }

      th {
        background: #f1f5f9 !important;
        color: black !important;
        font-size: 9px !important;
      }

      .col-total { color: black !important; }

      .summary-section {
        grid-template-columns: 1fr 240px !important;
        gap: 1rem !important;
        margin-top: 0.4rem !important;
      }

      .summary-box {
        background: white !important;
        border: 1px solid #ccc !important;
        padding: 0.4rem 0.6rem !important;
      }

      .summary-row { color: black !important; }

      .summary-box .grand-total {
        color: black !important;
        font-size: 1rem !important;
        border-top: 1px solid #000 !important;
      }
    }
  </style>
</head>
<body>
  <!-- Tab Navigation -->
<div class="tab-navigation">
  <button id="tabFormBtn" class="tab-btn active" onclick="switchTab('form')">
    📄 Create Invoice
  </button>
  <button id="tabListBtn" class="tab-btn" onclick="switchTab('list')">
    📋 All Invoices (<span id="invoiceCount">0</span>)
  </button>
</div>

<!-- Tab Content Views -->
<div id="invoiceFormView" class="tab-content active-content">
  <!-- Insert your existing Invoice Form HTML here -->
</div>

<div id="invoiceListView" class="tab-content" style="display: none;">
  <!-- All Invoices Table Container -->
  <div class="card">
    <div class="list-header">
      <h2>All Invoices</h2>
      <div class="filter-group">
        <input type="date" id="filterStartDate" onchange="loadHistory()" />
        <input type="date" id="filterEndDate" onchange="loadHistory()" />
        <button class="btn btn-secondary" onclick="clearFilters()">Reset Filters</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="history-table">
        <thead>
          <tr>
            <th>Invoice #</th>
            <th>Date</th>
            <th>Billed To</th>
            <th style="text-align: right;">Amount</th>
            <th style="text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <!-- Dynamically populated by JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>



  <div class="container">
    <div class="header-row">
      <div class="company-title">INVOICE</div>
      <div>
        <div class="field-group">
          <label>Invoice Number</label>
          <input type="text" id="invoiceNumber" placeholder="INV-1001" />
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <div class="field-group">
          <label>Billed From</label>
          <textarea id="billedFrom" rows="3"></textarea>
        </div>
      </div>
      <div>
        <div class="field-group">
          <label>Billed To</label>
          <textarea id="billedTo" rows="3" placeholder="Client Name & Address"></textarea>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="field-group">
        <label>Invoice Date</label>
        <input type="date" id="date" />
      </div>
      <div class="field-group">
        <label>Due Date</label>
        <input type="date" id="dueDate" />
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Description</th>
            <th class="col-qty">Qty</th>
            <th class="col-price">Price (<span class="currency-symbol">$</span>)</th>
            <th class="col-total">Total (<span class="currency-symbol">$</span>)</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="itemsTableBody">
          <!-- Dynamic line items -->
        </tbody>
      </table>
    </div>

    <button class="btn btn-add-row" onclick="addRow()">+ Add Item</button>

    <div class="summary-section">
      <div>
        <div class="grid-2">
          <div class="field-group">
            <label>Payment Terms</label>
            <input type="text" id="paymentTerms" />
          </div>
          <div class="field-group">
            <label>Payment Methods</label>
            <input type="text" id="paymentMethods" />
          </div>
        </div>
        <div class="field-group">
          <label>Bank Details</label>
          <textarea id="bankDetails" rows="2"></textarea>
        </div>
        <div class="field-group">
          <label>Notes</label>
          <textarea id="notes" rows="2"></textarea>
        </div>
      </div>

      <div class="summary-box">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotalDisplay">$0.00</span>
        </div>
        <div class="field-group">
          <label>Tax Rate (%)</label>
          <input type="number" id="taxRate" value="0" oninput="calculateTotals()" />
        </div>
        <div class="field-group">
          <label>Tax Reason</label>
          <input type="text" id="taxReason" />
        </div>
        <div class="field-group">
          <label>Discount Rate (%)</label>
          <input type="number" id="discountRate" value="0" oninput="calculateTotals()" />
        </div>
        <div class="field-group">
          <label>Discount Reason</label>
          <input type="text" id="discountReason" />
        </div>
        <div class="summary-row grand-total">
          <span>Grand Total:</span>
          <span id="grandTotalDisplay">$0.00</span>
        </div>
      </div>
    </div>

    <!-- MAIN CONTROL BUTTONS (Includes Clear Form) -->
    <div class="actions">
      <button class="btn btn-warning" onclick="clearForm()">Clear Form</button>
      <button class="btn btn-secondary" onclick="window.print()">Print / Save PDF</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Save Invoice</button>
    </div>

    <!-- INVOICE HISTORY SECTION -->
    <div class="history-section">
      <div class="history-header">
        <div class="history-title">Saved Invoices History</div>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="loadHistory()">Refresh History</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Invoice #</th>
              <th>Date</th>
              <th>Billed To</th>
              <th style="text-align: right;">Amount (<span class="currency-symbol">$</span>)</th>
              <th class="col-action">Actions</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #94a3b8; padding: 16px;">Loading saved invoices...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  let appConfig = null; // Changed initial state to null
  let subtotalValue = 0;
  let grandTotalValue = 0;
  let isEditingExisting = false;

  async function loadConfig() {
    try {
      const res = await fetch('/api/config');
      appConfig = await res.json();
      applyConfigToUI();
    } catch (err) {
      console.error('Error loading config:', err);
    }
  }

  function applyConfigToUI() {
    // Prevent running if config hasn't loaded yet
    if (!appConfig) return;

    const billedFrom = document.getElementById('billedFrom');
    if (billedFrom) {
      const name = appConfig.company_name || '';
      const address = appConfig.company_address || '';
      const phone = appConfig.company_phone ? `Phone: ${appConfig.company_phone}` : '';
      const email = appConfig.company_email ? `Email: ${appConfig.company_email}` : '';
      const taxId = appConfig.company_tax_id ? `Tax ID: ${appConfig.company_tax_id}` : '';

      billedFrom.value = [name, address, phone, email, taxId].filter(Boolean).join('\n');
    }

    document.getElementById('paymentTerms').value = appConfig.default_payment_terms || '';
    document.getElementById('paymentMethods').value = appConfig.default_payment_methods || '';
    document.getElementById('bankDetails').value = appConfig.default_bank_details || '';
    document.getElementById('notes').value = appConfig.default_notes || '';
    
    document.getElementById('taxRate').value = appConfig.default_tax_rate || 0;
    document.getElementById('taxReason').value = appConfig.default_tax_reason || '';
    document.getElementById('discountRate').value = 0;
    document.getElementById('discountReason').value = '';

    document.querySelectorAll('.currency-symbol').forEach(el => {
      el.textContent = appConfig.currency_symbol || '$';
    });

    calculateTotals();
  }

  function formatCurrency(amount) {
    const symbol = (appConfig && appConfig.currency_symbol) ? appConfig.currency_symbol : '$';
    const val = parseFloat(amount) || 0;
    return `${symbol}${val.toFixed(2)}`;
  }

  function addRow(description = '', qty = 1, price = 0) {
    const tbody = document.getElementById('itemsTableBody');
    const tr = document.createElement('tr');
    tr.className = 'item-row';
    tr.innerHTML = `
      <td><input type="text" class="item-desc" value="${description}" placeholder="Item description" /></td>
      <td><input type="number" class="item-qty" value="${qty}" min="1" oninput="calculateTotals()" /></td>
      <td><input type="number" class="item-price" value="${price}" step="0.01" oninput="calculateTotals()" /></td>
      <td class="col-total item-total">$0.00</td>
      <td class="col-action"><button class="btn btn-danger" onclick="removeRow(this)">✕</button></td>
    `;
    tbody.appendChild(tr);
    calculateTotals();
  }

  function removeRow(btn) {
    btn.closest('tr').remove();
    calculateTotals();
  }

  function calculateTotals() {
    let subtotal = 0;
    document.querySelectorAll('.item-row').forEach(row => {
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      const lineTotal = qty * price;
      row.querySelector('.item-total').textContent = formatCurrency(lineTotal);
      subtotal += lineTotal;
    });

    const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
    const discountRate = parseFloat(document.getElementById('discountRate').value) || 0;

    const discountAmount = subtotal * (discountRate / 100);
    const taxableSubtotal = subtotal - discountAmount;
    const taxAmount = taxableSubtotal * (taxRate / 100);
    const grandTotal = taxableSubtotal + taxAmount;

    subtotalValue = subtotal;
    grandTotalValue = grandTotal;

    document.getElementById('subtotalDisplay').textContent = formatCurrency(subtotal);
    document.getElementById('grandTotalDisplay').textContent = formatCurrency(grandTotal);
  }

  /* FULL CLEAR FORM FUNCTION */
  function clearForm() {
    isEditingExisting = false;

    // Reset Top Inputs
    document.getElementById('invoiceNumber').value = 'INV-' + Math.floor(1000 + Math.random() * 9000);
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('dueDate').value = '';
    document.getElementById('billedTo').value = '';
    
    // Clear Line Items
    document.getElementById('itemsTableBody').innerHTML = '';
    addRow('', 1, 0);

    // Reset or Apply Config Defaults safely
    if (appConfig) {
      applyConfigToUI();
    } else {
      document.getElementById('billedFrom').value = '';
      document.getElementById('paymentTerms').value = '';
      document.getElementById('paymentMethods').value = '';
      document.getElementById('bankDetails').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('taxRate').value = 0;
      document.getElementById('taxReason').value = '';
      document.getElementById('discountRate').value = 0;
      document.getElementById('discountReason').value = '';
      calculateTotals();
    }
  }

  async function saveInvoice() {
    const items = [];
    document.querySelectorAll('.item-row').forEach(row => {
      items.push({
        description: row.querySelector('.item-desc').value,
        qty: parseFloat(row.querySelector('.item-qty').value) || 0,
        price: parseFloat(row.querySelector('.item-price').value) || 0
      });
    });

    const payload = {
      invoiceNumber: document.getElementById('invoiceNumber').value,
      isUpdate: isEditingExisting,
      date: document.getElementById('date').value,
      dueDate: document.getElementById('dueDate').value,
      billedFrom: document.getElementById('billedFrom').value,
      billedTo: document.getElementById('billedTo').value,
      paymentTerms: document.getElementById('paymentTerms').value,
      paymentMethods: document.getElementById('paymentMethods').value,
      bankDetails: document.getElementById('bankDetails').value,
      notes: document.getElementById('notes').value,
      subtotal: subtotalValue,
      taxRate: parseFloat(document.getElementById('taxRate').value) || 0,
      taxReason: document.getElementById('taxReason').value,
      discountRate: parseFloat(document.getElementById('discountRate').value) || 0,
      discountReason: document.getElementById('discountReason').value,
      grandTotal: grandTotalValue,
      items: items
    };

    const res = await fetch('/api/save-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.message);
    loadHistory();
  }

  async function loadHistory() {
    const tbody = document.getElementById('historyTableBody');
    try {
      const res = await fetch('/api/invoices');
      const invoices = await res.json();

      if (invoices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 16px;">No saved invoices found.</td></tr>';
        return;
      }

      tbody.innerHTML = invoices.map(inv => `
        <tr>
          <td style="font-weight: 600; color: #38bdf8;">${inv.id}</td>
          <td>${inv.inv_date || '-'}</td>
          <td>${(inv.billed_to || 'N/A').split('\n')[0]}</td>
          <td style="text-align: right; font-weight: 600;">${formatCurrency(inv.grand_total)}</td>
          <td class="col-action">
            <div style="display: flex; gap: 4px; justify-content: center;">
              <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="editInvoice('${inv.id}')">Edit</button>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deleteInvoice('${inv.id}')">✕</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 16px;">Error loading history.</td></tr>';
    }
  }

  async function editInvoice(invId) {
    try {
      const res = await fetch(`/api/invoice/${invId}`);
      const inv = await res.json();

      document.getElementById('invoiceNumber').value = inv.id;
      document.getElementById('date').value = inv.inv_date || '';
      document.getElementById('dueDate').value = inv.due_date || '';
      document.getElementById('billedFrom').value = inv.billed_from || '';
      document.getElementById('billedTo').value = inv.billed_to || '';
      document.getElementById('paymentTerms').value = inv.payment_terms || '';
      document.getElementById('paymentMethods').value = inv.payment_methods || '';
      document.getElementById('bankDetails').value = inv.bank_details || '';
      document.getElementById('notes').value = inv.notes || '';
      document.getElementById('taxRate').value = inv.tax_rate || 0;
      document.getElementById('taxReason').value = inv.tax_reason || '';
      document.getElementById('discountRate').value = inv.discount_rate || 0;
      document.getElementById('discountReason').value = inv.discount_reason || '';

      const tbody = document.getElementById('itemsTableBody');
      tbody.innerHTML = '';
      (inv.items || []).forEach(item => {
        addRow(item.description, item.qty, item.price);
      });

      isEditingExisting = true;
      calculateTotals();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      alert('Failed to load invoice details');
    }
  }

  async function deleteInvoice(invId) {
    if (!confirm(`Delete invoice ${invId}?`)) return;
    try {
      await fetch(`/api/invoice/${invId}`, { method: 'DELETE' });
      loadHistory();
    } catch (err) {
      alert('Failed to delete invoice');
    }
  }

  // Proper order: Load config first, then clear form & load history
  document.addEventListener('DOMContentLoaded', async () => {
    await loadConfig();
    clearForm();
    loadHistory();
  });
</script>

</body>
</html>
